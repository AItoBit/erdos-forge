[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos-forge"
version = "0.3.0"
description = "Autonomous Lean 4 formalization & proof-search system for Erdős problems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
erdos-forge = "erdos_forge.cli:main"

[tool.setuptools.packages.find]
include = ["erdos_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lean: requires a Lean toolchain and a built Lean project (slow)",
    "mathlib: requires a Lean project with Mathlib built (very slow)",
]
